<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpark Availability</title>
    <link rel="stylesheet" href="CarparkAvailability.css">
</head>
<body>
    
    <div class="container">
        <div class="nav-bar">
            <a href="Main_page.html" class="btn-home">Home</a>
        </div>

        <h1>Carpark Lot Availability</h1>

        <div class="search-container">
            <input id="searchInput" type="text" placeholder="Search carpark or address...">
            <button onclick="search()" class="btn-search">Search</button>
            <button onclick="clearSearch()" class="btn-clear">Clear</button>
        </div>

        <p id="noResults" class="hidden">No results found</p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Carpark No.</th>
                        <th>Address</th>
                        <th>Total Lots</th>
                        <th>Available Lots</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="CarparkAvailability.js"></script>
</body>
</html>
