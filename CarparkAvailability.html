<!DOCTYPE html>
<html>
<head>
<title>Carpark Lot Tracker</title>

<style>
body { font-family: Arial; margin: 20px; }
h1 { text-align: center; }

input, button {
    padding: 8px;
    font-size: 14px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid #999;
    padding: 8px;
}

th { background: #f2f2f2; }

#noResults {
    color: red;
    margin-top: 10px;
    display: none;
}
</style>
</head>

<body>

<h1>Carpark Lot Availability</h1>

<input id="searchInput" placeholder="Search carpark or address">
<button onclick="search()">Search</button>
<button onclick="clearSearch()">Clear</button>

<p id="noResults">No results found</p>

<table>
<thead>
<tr>
<th>Carpark Number</th>
<th>Address</th>
<th>Total Lots</th>
<th>Available Lots</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>
let allData = [];

function makeSearchable(text) {
    return text
        .toLowerCase()
        .replace(/[^a-z0-9]/g, " ")  
        .replace(/\s+/g, " ")
        .trim();
}

Promise.all([
    fetch("HDBCarparkInformation.json").then(r => r.json()),
    fetch("https://api.data.gov.sg/v1/transport/carpark-availability").then(r => r.json())
]).then(data => {

    let info = data[0];
    let availability = data[1].items[0].carpark_data;

    info.forEach(c => {

        let number = c.car_park_no.trim();
        let address = c.address;

        let match = availability.find(a =>
            a.carpark_number.trim() === number
        );

        let carLot = match
            ? match.carpark_info.find(x => x.lot_type === "C")
            : null;

        allData.push({
            number: number,
            address: address,
            total: carLot ? carLot.total_lots : "N/A",
            available: carLot ? carLot.lots_available : "N/A",
            searchText: makeSearchable(number + " " + address)
        });
    });

    showTable(allData);
});

function showTable(data) {
    let body = document.getElementById("tableBody");
    document.getElementById("noResults").style.display = "none";

    if (data.length === 0) {
        body.innerHTML = ""; 
        document.getElementById("noResults").style.display = "block";
        return;
    }

    // Build the HTML string in memory first to prevent freezing
    let htmlContent = "";
    
    data.forEach(i => {
        htmlContent += `
        <tr>
            <td>${i.number}</td>
            <td>${i.address}</td>
            <td>${i.total}</td>
            <td>${i.available}</td>
        </tr>
        `;
    });

    // Update the DOM only once!
    body.innerHTML = htmlContent;
}                                                                       

function search() {
    let input = makeSearchable(document.getElementById("searchInput").value);
    let words = input.split(" ");

    let results = allData.filter(item =>
        words.every(w => item.searchText.includes(w))
    );

    showTable(results);
}

function clearSearch() {
    document.getElementById("searchInput").value = "";
    showTable(allData);
}
</script>

</body>
</html>
