<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Mall Carpark Rates</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="nav-bar">
        <nav>
            <a href="index.html" class="btn-home">Home</a>
        </nav>
    </header>

    <main class="container">
        <h1>Singapore Mall Carpark Pricing</h1>
        
        <section class="search-container">
            <input type="text" id="searchInput" placeholder="Search for a mall (e.g., VivoCity)..." aria-label="Search Mall">
            <button class="btn-search" id="searchBtn">Search</button>
            <button class="btn-clear" id="clearBtn">Clear</button>
        </section>

        <p id="errorMessage" class="hidden error-text"></p>
        <p id="noResults" class="hidden">No malls found matching your search.</p>

        <section class="table-wrapper">
            <table id="carparkTable">
                <thead>
                    <tr>
                        <th>Mall Name</th>
                        <th>Total Lots</th>
                        <th>Weekdays (Before 5 PM)</th>
                        <th>Weekdays (After 5 PM)</th>
                        <th>Saturdays</th>
                        <th>Sundays & Public Holidays</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </section>
    </main>

    <script src="js/carpark-mall-prices.js"></script>
</body>
</html>
