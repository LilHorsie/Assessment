<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpark Availability - Singapore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header class="nav-bar">
        <nav>
            <a href="index.html" class="btn-home">Home</a>
        </nav>
    </header>

    <main class="container">
        <h1>Carpark Lot Availability</h1>

        <section class="search-container">
            <input id="searchInput" type="text" placeholder="Search carpark or address..." aria-label="Search for a carpark">
            <button onclick="search()" class="btn-search">Search</button>
            <button onclick="clearSearch()" class="btn-clear">Clear</button>
        </section>

        <p id="errorMessage" class="hidden error-text"></p>
        <p id="noResults" class="hidden">No results found</p>

        <section class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Carpark No.</th>
                        <th>Address</th>
                        <th>Total Lots</th>
                        <th>Available Lots</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </section>
    </main>

    <script src="js/carpark-availability.js"></script>
</body>
</html>
