<!DOCTYPE html>
<html>
<head>
  <title>Taxi Availability in Singapore</title>
  <meta charset="utf-8">


  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }
    #info {
      padding: 10px;
      background: #f2f2f2;
    }
    #map {
      height: 90vh;
    }
  </style>
</head>

<body>

  <div id="info">
    <strong>Taxi Availability</strong><br>
    <span id="status">Loading data...</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    var map = L.map("map").setView([1.3521, 103.8198], 12);

    // Load map tiles
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    fetch("https://api.data.gov.sg/v1/transport/taxi-availability")
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {

        var taxiData = data.features[0];
        var taxis = taxiData.geometry.coordinates;
        var count = taxiData.properties.taxi_count;
        var time = taxiData.properties.timestamp;


        document.getElementById("status").innerText =
          "Available taxis: " + count + " (Updated: " + time + ")";

        for (var i = 0; i < taxis.length; i++) {
          var longitude = taxis[i][0];
          var latitude = taxis[i][1];

          L.circleMarker([latitude, longitude], {
            radius: 3,
            color: "green"
          }).addTo(map);
        }
      })
      .catch(function(error) {
        document.getElementById("status").innerText =
          "Error loading taxi data.";
      });
  </script>

</body>
</html>
